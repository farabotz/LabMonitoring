[project]
name = "labaccess"
version = "0.1.0"
description = "Prototipe desktop sesi laboratorium dan verifikasi wajah 1:1"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "argon2-cffi>=23,<26",
  "pydantic-settings>=2.7,<3", "PyJWT>=2.10,<3", "cryptography>=44,<47",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "PySide6>=6.8,<6.11",
  "opencv-python-headless>=4.11,<5", "numpy>=2.1,<3", "psutil>=6,<8",
  "pywin32>=310; sys_platform == 'win32'"
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-qt>=4.4,<5", "nuitka>=2.7,<5", "ordered-set>=4.1,<5", "zstandard>=0.23,<1", "psutil>=6,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.uv]
package = false
